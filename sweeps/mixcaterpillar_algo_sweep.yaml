program: run_tree_shape_sweep.py
method: grid
metric:
  name: algorithms_summary/finalAvgRegret
  goal: minimize
parameters:
  tree-shape:
    value: "mixcaterpillar"
  K:
    values: [3]
  rounds:
    value: 100000000
  algo:
    values: ["EE3", "Q", "R"]
  ratio:
    value: 0
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --regen-tree-each-run
  - ${args}
