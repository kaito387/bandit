program: run_tree_shape_sweep.py
method: grid
metric:
  name: algorithms_summary/finalAvgRegret
  goal: minimize
parameters:
  tree-shape:
    value: "mixcaterpillar"
  K:
    values: [3]
  rounds:
    value: 100000000
  algo:
    value: "PS"
  ratio:
    values: [0.95, 0.98, 1]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --regen-tree-each-run
  - ${args}