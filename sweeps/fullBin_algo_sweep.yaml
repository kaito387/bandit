program: run_tree_shape_sweep.py
method: grid
metric:
  name: algorithms_summary/finalAvgRegret
  goal: minimize
parameters:
  tree-shape:
    value: "mix-full-binary"
  K:
    values: [3]
  S:
    value: 2
  rounds:
    value: 5000000
  seed:
    value: 42
  algo:
    values: ["EE3", "R", "Q"]
  ratio:
    value: 0
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --regen-tree-each-run
  - ${args}
